<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Collector Approvals · EcoBridge</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/portal.css">
  <link rel="stylesheet" href="/admin.css">
</head>
<body>
  <main class="admin-shell">
    <header class="admin-top">
      <a class="brand" href="/"><span class="brand-icon"><i data-lucide="leaf"></i></span><span><span class="brand-eco">Eco</span><span class="brand-bridge">Bridge</span></span></a>
      <a class="ghost" href="/dashboard.html"><i data-lucide="layout-dashboard"></i> Dashboard</a>
    </header>
    <div class="admin-content">
      <div class="eyebrow">ADMIN WORKSPACE</div>
      <div class="admin-heading"><div><h1>Collector approvals</h1><p>Review applications before granting pickup access.</p></div><button class="ghost" id="refresh"><i data-lucide="refresh-cw"></i> Refresh</button></div>
      <div id="message" role="status" aria-live="polite"></div>
      <section class="admin-section"><div class="section-heading"><h2>Pending applications</h2><span id="pendingCount" class="status-badge">0 pending</span></div><div id="pending" class="application-list"></div></section>
      <section class="admin-section"><div class="section-heading"><h2>Reviewed applications</h2></div><div id="reviewed" class="application-list"></div></section>
    </div>
  </main>
  <script src="/vendor/lucide.min.js"></script>
  <script src="/admin.js"></script>

</html>

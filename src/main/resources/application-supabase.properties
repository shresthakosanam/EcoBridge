spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.data-source-properties.prepareThreshold=0
# Vercel container instances have a short startup window. Create the web
# server first and initialize database-backed beans when the first API request
# needs them, instead of blocking static pages during every cold start.
spring.main.lazy-initialization=${SPRING_LAZY_INITIALIZATION:true}
spring.data.jpa.repositories.bootstrap-mode=lazy
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# The production schema is already managed by the checked-in migrations.
# Enable this explicitly only for a controlled migration run, not for every
# short-lived Vercel container instance.
spring.flyway.enabled=${RUN_DB_MIGRATIONS:false}
spring.flyway.locations=classpath:db/migration/postgresql
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.h2.console.enabled=false
server.servlet.session.cookie.secure=true
server.forward-headers-strategy=framework
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

spring.application.name=EcoBridge
server.port=${PORT:8080}
spring.jackson.serialization.write-dates-as-timestamps=false
spring.datasource.url=jdbc:h2:file:./data/ecobridge;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Firebase Auth is configured with FIREBASE_* environment variables and
# GOOGLE_APPLICATION_CREDENTIALS pointing to a Firebase service-account JSON file.

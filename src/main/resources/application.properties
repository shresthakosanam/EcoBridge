spring.application.name=EcoBridge
server.port=${PORT:8080}
spring.jackson.serialization.write-dates-as-timestamps=false
spring.datasource.url=jdbc:h2:file:./data/ecobridge;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=false
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# API CSRF is omitted for this same-origin prototype. Authentication uses BCrypt
# passwords and SameSite server sessions; production uses Secure cookies.
# Firebase credentials are used only for optional image storage.

services:
  - type: web
    name: ecobridge
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    autoDeployTrigger: commit
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: DATABASE_HOST
        fromDatabase:
          name: ecobridge-db
          property: host
      - key: DATABASE_PORT
        fromDatabase:
          name: ecobridge-db
          property: port
      - key: DATABASE_NAME
        fromDatabase:
          name: ecobridge-db
          property: database
      - key: DATABASE_USER
        fromDatabase:
          name: ecobridge-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: ecobridge-db
          property: password
      - key: FIREBASE_API_KEY
        sync: false
      - key: FIREBASE_AUTH_DOMAIN
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_STORAGE_BUCKET
        sync: false
      - key: FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: FIREBASE_APP_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
databases:
  - name: ecobridge-db
    plan: free
    region: singapore
    databaseName: ecobridge
    user: ecobridge
